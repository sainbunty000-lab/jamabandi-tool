<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamabandi Nakal Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #f0f4f8; padding: 14px; display: flex; flex-direction: column; align-items: center; }
    
    .card {
      width: 100%; max-width: 450px; background: #ffffff; border-radius: 12px;
      padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 12px;
    }

    .title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 16px; color: #0b6623; font-weight: bold; }
    .status { background: #e8f5e9; color: #2e7d32; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }

    /* Open Portal Buttons */
    .btn-portal {
      display: block; width: 100%; padding: 13px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;
      text-decoration: none; color: white; margin-bottom: 8px;
    }
    .bg-nakal { background: #0b6623; }
    .bg-iglr { background: #1a73e8; }

    label { font-size: 12px; font-weight: bold; color: #444; margin-bottom: 6px; display: block; }
    .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .radio-box {
      background: #f8f9fa; padding: 8px; border-radius: 6px; font-size: 12px;
      display: flex; align-items: center; gap: 6px; border: 1px solid #ddd;
    }

    input[type="text"] {
      width: 100%; padding: 11px; border: 1.5px solid #0b6623; border-radius: 8px;
      font-size: 14px; margin-bottom: 10px; outline: none;
    }

    .btn-action {
      width: 100%; padding: 12px; background: #ff9800; color: white; border: none;
      border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
    }

    .note {
      background: #eef3fc; border-left: 4px solid #1a73e8; padding: 9px;
      border-radius: 4px; font-size: 12px; color: #1e3a8a; line-height: 1.4; margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title-bar">
      <h1>⚡ Jamabandi Direct Pro</h1>
      <span class="status">🟢 Active</span>
    </div>

    <!-- Hidden Referrer Safe Links -->
    <a href="https://jamabandi.nic.in/land%20records/NakalRecord" target="_blank" rel="opener" class="btn-portal bg-nakal">
      📄 Nakal Details खोलें (Direct Mode)
    </a>

    <a href="https://jamabandi.nic.in/IGLR/SearchRural" target="_blank" rel="opener" class="btn-portal bg-iglr">
      🏛️ IGLR Registry खोलें
    </a>
  </div>

  <div class="card">
    <label>सर्च का प्रकार (Search Type):</label>
    <div class="radio-grid">
      <label class="radio-box"><input type="radio" name="stype" value="Owner" checked> By Owner Name</label>
      <label class="radio-box"><input type="radio" name="stype" value="Khewat"> By Khewat</label>
      <label class="radio-box"><input type="radio" name="stype" value="Khasra"> By Khasra No.</label>
      <label class="radio-box"><input type="radio" name="stype" value="Mutation"> By Mutation Date</label>
    </div>

    <label>पिता/दादा का नाम या खसरा दर्ज करें:</label>
    <input type="text" id="qVal" placeholder="उदा: Ramesh / हवा सिंह / 14//5" />

    <button class="btn-action" onclick="copyFilter()">📋 ऑटो-फिल्टर कोड कॉपी करें</button>

    <div class="note">
      <b>नकल पेज खोलने के बाद:</b><br>
      जिला, तहसील, गांव चुनें। फिर यहाँ से कोड कॉपी करके Nakal पेज के एड्रेस बार में पेस्ट करके Go/Enter दबाएं।
    </div>
  </div>

  <script>
    function copyFilter() {
      const q = document.getElementById("qVal").value.trim().toLowerCase();
      const type = document.querySelector('input[name="stype"]:checked').value;

      const script = `javascript:(function(){
        // रेडियो बटन चुनना
        document.querySelectorAll('input[type="radio"]').forEach(r=>{
          if(r.nextSibling && r.nextSibling.textContent.includes('${type}')) r.click();
        });
        // वर्ष ऑटो चुनना
        document.querySelectorAll('select').forEach(s=>{
          if(s.id.toLowerCase().includes('year') && s.options.length>1){
            s.selectedIndex=1;
            s.dispatchEvent(new Event('change',{bubbles:true}));
          }
        });
        // नाम फिल्टर
        let q='${q}';
        if(q){
          let sel=null;
          document.querySelectorAll('select').forEach(s=>{if(s.options.length>15) sel=s;});
          if(sel){
            let ok=false;
            for(let i=0;i<sel.options.length;i++){
              if(sel.options[i].text.toLowerCase().includes(q)){
                sel.selectedIndex=i;
                sel.dispatchEvent(new Event('change',{bubbles:true}));
                ok=true;
                alert('चयनित: '+sel.options[i].text);
                break;
              }
            }
            if(!ok) alert('नाम नहीं मिला!');
          }
        }
      })();`;

      navigator.clipboard.writeText(script.replace(/\\s+/g, ' ')).then(() => {
        alert("कोड कॉपी हो गया!\\n\\nNakal पेज के एड्रेस बार में पेस्ट करके Go दबाएं।");
      });
    }
  </script>
</body>
</html>
