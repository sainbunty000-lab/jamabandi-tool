<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamabandi Smart Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; padding: 16px; display: flex; flex-direction: column; align-items: center; }

    .card {
      width: 100%; max-width: 480px; background: #ffffff; border-radius: 12px;
      padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 16px;
    }

    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header-row h1 { font-size: 17px; color: #0b6623; font-weight: bold; }
    .badge { background: #e8f5e9; color: #2e7d32; font-size: 12px; padding: 4px 8px; border-radius: 20px; font-weight: bold; }

    label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; display: block; }
    
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input {
      flex: 1; padding: 12px; border: 1.5px solid #0b6623; border-radius: 8px;
      font-size: 15px; outline: none;
    }
    
    button.btn-main {
      width: 100%; padding: 13px; background: #0b6623; color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
      display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    button.btn-sub {
      width: 100%; padding: 11px; background: #1a73e8; color: white; border: none;
      border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
    }

    .info-box {
      background: #eef3fc; border-left: 4px solid #1a73e8; padding: 10px;
      border-radius: 4px; font-size: 13px; color: #1e3a8a; line-height: 1.5; margin-top: 10px;
    }

    /* Floating Bookmark Tool (For In-Page Filter) */
    .magic-link {
      display: block; width: 100%; text-align: center; background: #ff9800;
      color: white; padding: 12px; border-radius: 8px; font-weight: bold;
      text-decoration: none; font-size: 14px; margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-row">
      <h1>⚡ Jamabandi Smart Tool</h1>
      <span class="badge" id="sessionStatus">🟢 Active</span>
    </div>

    <!-- Step 1: Open Portal Directly -->
    <button class="btn-main" onclick="openPortal()">
      🚀 1-क्लिक में Jamabandi पोर्टल खोलें
    </button>

    <div class="info-box">
      <b>पिता या दादा का नाम फिल्टर कैसे करें:</b><br>
      पोर्टल खुलने के बाद जब गांव चुन लें, तो नाम ढूंढने के लिए नीचे दिए गए बटन का इस्तेमाल करें।
    </div>
  </div>

  <div class="card">
    <label>पिता या दादा का नाम दर्ज करें:</label>
    <div class="input-group">
      <input type="text" id="parentName" placeholder="उदा: Ramesh / हवा सिंह" />
    </div>

    <button class="btn-sub" onclick="copyFilterCode()">
      📋 फिल्टर टूल चालू करें (Copy Code)
    </button>
  </div>

  <script>
    // 1. Open Portal in Direct Clean View (Bypasses Frame Blocks)
    function openPortal() {
      window.open("https://jamabandi.nic.in/IGLR/SearchRural", "_blank");
    }

    // 2. Keep-Alive Ping (Runs in background)
    setInterval(() => {
      fetch("https://jamabandi.nic.in/IGLR/SearchRural", { mode: 'no-cors' })
        .then(() => {
          document.getElementById("sessionStatus").innerText = "🟢 Active";
        })
        .catch(() => {});
    }, 240000);

    // 3. Inject Filter Script
    function copyFilterCode() {
      const q = document.getElementById("parentName").value.trim().toLowerCase();
      if (!q) {
        alert("कृपया पहले पिता या दादा का नाम बॉक्स में लिखें!");
        return;
      }

      // Generate in-page search command
      const code = `javascript:(function(){let q='${q}';let s=null;document.querySelectorAll('select').forEach(el=>{if(el.options.length>15)s=el;});if(!s){alert('कृपया पोर्टल पर पहले गांव चुनकर नाम लोड होने दें!');return;}let m=0;for(let i=0;i<s.options.length;i++){if(s.options[i].text.toLowerCase().includes(q)){s.selectedIndex=i;s.dispatchEvent(new Event('change',{bubbles:true}));m++;break;}}if(!m)alert('इस नाम से कोई रिकॉर्ड नहीं मिला!');})();`;

      navigator.clipboard.writeText(code).then(() => {
        alert("सर्च कोड कॉपी हो गया है!\n\nJamabandi पोर्टल वाले टैब में जाएं, एड्रेस बार में इसे पेस्ट करके Enter दबाएं। नाम अपने आप सेलेक्ट हो जाएगा।");
      });
    }
  </script>
</body>
</html>
